:root{--night:#0C0A07;--card:#161209;--ivory:#FFFEF2;--ivory-soft:rgba(255,254,242,.74);--ivory-faint:rgba(255,254,242,.5);
--gold:#C9A24B;--gold-bright:#E7C87E;--hairline:rgba(201,162,75,.28);--hairline-soft:rgba(201,162,75,.16);--ease:cubic-bezier(.16,1,.3,1)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--night);color:var(--ivory);font-family:'Archivo',system-ui,sans-serif;font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100svh}
.wrap{max-width:520px;margin:0 auto;padding:0 20px}
header{padding:18px 0;border-bottom:1px solid var(--hairline-soft)}
.mark{display:flex;align-items:center;gap:12px;color:var(--ivory);text-decoration:none;justify-content:center}
.mark img{width:32px;height:32px}
.mark b{font-family:'Fraunces',serif;font-weight:560;font-size:1.1rem}
.mark span{font-size:.64rem;letter-spacing:.26em;color:var(--gold);text-transform:uppercase}
h1{font-family:'Fraunces',serif;font-weight:520;font-size:clamp(1.7rem,6vw,2.2rem);text-align:center;margin:34px 0 6px;line-height:1.1}
.sub{text-align:center;color:var(--ivory-soft);font-size:.95rem;margin-bottom:26px}
.panel{background:var(--card);border:1px solid var(--hairline-soft);border-radius:16px;padding:24px;margin-bottom:18px}
label{display:block;font-size:.7rem;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin:14px 0 6px}
input{width:100%;background:#0F0C07;border:1px solid var(--hairline);border-radius:10px;color:var(--ivory);font:inherit;font-size:16px;padding:12px 14px}
input:focus{outline:2px solid var(--gold);outline-offset:1px;border-color:var(--gold)}
.btn{display:inline-flex;width:100%;align-items:center;justify-content:center;gap:8px;background:var(--gold);color:#14100A;font-weight:650;font-size:1rem;padding:14px 24px;border-radius:999px;border:0;cursor:pointer;margin-top:18px;font-family:inherit;transition:transform .2s var(--ease),background .2s}
.btn:hover{background:var(--gold-bright)} .btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--ivory-soft);border:1.5px solid rgba(255,254,242,.35);font-weight:500}
.btn.ghost:hover{border-color:var(--gold-bright);color:var(--gold-bright)}
.btn[disabled]{opacity:.5;cursor:wait}
.msg{margin-top:14px;font-size:.92rem;text-align:center;color:var(--ivory-soft)}
.msg.err{color:#E88585}
.linkish{background:none;border:0;color:var(--gold-bright);font:inherit;font-size:.86rem;cursor:pointer;display:block;margin:14px auto 0;padding:6px}
.linkish:hover{color:var(--ivory)}
.tab{display:flex;gap:8px;margin-bottom:6px}
.tab button{flex:1;background:transparent;border:1px solid var(--hairline-soft);color:var(--ivory-soft);border-radius:999px;padding:9px;font:inherit;font-size:.88rem;cursor:pointer}
.tab button.on{background:var(--gold);color:#14100A;font-weight:650;border-color:var(--gold)}
.member-card{position:relative;overflow:hidden;background:linear-gradient(135deg,#1A1408 0%,#0F0C06 55%,#1C1509 100%);border:1px solid var(--hairline);border-radius:18px;box-shadow:0 24px 60px -24px rgba(0,0,0,.85),inset 0 1px 0 rgba(231,200,126,.14);padding:24px;margin:8px 0 18px}
.member-card::before{content:"";position:absolute;inset:-40%;pointer-events:none;background:linear-gradient(115deg,transparent 42%,rgba(231,200,126,.13) 50%,transparent 58%);transform:translateX(-70%);animation:sheen 6s var(--ease) infinite}
@keyframes sheen{0%,55%{transform:translateX(-70%)}88%,100%{transform:translateX(70%)}}
.member-card.full{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 24px 70px -20px rgba(201,162,75,.45)}
.mc-meta{font-size:.76rem;color:var(--ivory-faint);margin:4px 0 12px;letter-spacing:.05em}
.mc-meta b{color:var(--gold-bright);font-weight:650}
.mc-top{display:flex;align-items:center;justify-content:space-between}
.mc-top img{width:40px;height:40px}
.mc-top span{font-size:.62rem;font-weight:600;letter-spacing:.28em;text-transform:uppercase;color:var(--gold);text-align:right}
.mc-name{font-family:'Fraunces',serif;font-style:italic;font-size:1.5rem;margin:18px 0 4px}
.mc-code{font-size:.78rem;letter-spacing:.3em;color:var(--ivory-faint)}
.mc-code b{color:var(--gold-bright);font-weight:650}
.stamps{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}
.stamps i{width:36px;aspect-ratio:1;border-radius:50%;border:1px dashed rgba(201,162,75,.5);display:flex;align-items:center;justify-content:center;font-style:normal;color:#14100A;font-size:.95rem}
.stamps i.on{background:var(--gold);border:1px solid var(--gold-bright);animation:pop .45s var(--ease) both}
@keyframes pop{from{transform:scale(.35);opacity:0}to{transform:scale(1);opacity:1}}
@media(prefers-reduced-motion:reduce){.member-card::before{animation:none}.stamps i.on{animation:none}}
.progress{margin-top:14px;font-size:.9rem;color:var(--ivory-soft)}
.progress b{color:var(--gold-bright)}
.hist{list-style:none;font-size:.9rem;color:var(--ivory-soft)}
.hist li{padding:9px 0;border-bottom:1px solid var(--hairline-soft);display:flex;justify-content:space-between;gap:10px}
.hist li:last-child{border-bottom:0}
.hist .gold{color:var(--gold-bright)}
.footnote{text-align:center;color:var(--ivory-faint);font-size:.8rem;margin:26px 0 40px}
.footnote a{color:var(--gold-bright);text-decoration:none}
.hidden{display:none!important}
.stat-row{display:flex;justify-content:space-between;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--hairline-soft);font-size:.95rem}
.stat-row:last-child{border-bottom:0}
.stat-row b{font-family:'Fraunces',serif;font-size:1.3rem;color:var(--gold-bright)}
</style>

  </div>

  <p class="footnote"><a href="./">← Back to House of Mosaic</a></p>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
  var SB = supabase.createClient("https://nnhvufeipggrgihemgpg.supabase.co", "sb_publishable_2djimzHQm2f4pqArhenyIQ_Nk614xVG");
  function codeOf(id){ return id.replace(/-/g,"").slice(0,8).toUpperCase(); }
  function esc(s){ var d=document.createElement('div'); d.textContent=s==null?'':String(s); return d.innerHTML; }
</script>
<script>
var current = null, PER = 8, LABEL = "A gift from the house";

document.getElementById("goBtn").onclick = async function(){
  var msg = document.getElementById("authMsg"); msg.className="msg"; msg.textContent="";
  var r = await SB.auth.signInWithPassword({
    email: document.getElementById("fEmail").value.trim(),
    password: document.getElementById("fPass").value
  });
  if(r.error){ msg.className="msg err"; msg.textContent = r.error.message; return; }
  boot();
};
document.getElementById("outBtn").onclick = async function(){ await SB.auth.signOut(); location.reload(); };

async function boot(){
  var s = await SB.auth.getSession();
  if(!s.data.session) return;
  // staff check: the staff table is only readable by staff
  var st = await SB.from("staff").select("user_id").eq("user_id", s.data.session.user.id);
  if(st.error || !(st.data||[]).length){
    var msg = document.getElementById("authMsg");
    msg.className="msg err"; msg.textContent = "This account is not staff.";
    await SB.auth.signOut(); return;
  }
  var set = await SB.from("settings").select("key, value");
  (set.data||[]).forEach(function(r){ if(r.key==="stamps_per_reward") PER = parseInt(r.value)||8; if(r.key==="reward_label") LABEL = r.value; });
  document.getElementById("authView").classList.add("hidden");
  document.getElementById("deskView").classList.remove("hidden");
}

document.getElementById("findBtn").onclick = lookup;
async function lookup(){
  var msg = document.getElementById("findMsg"); msg.className="msg"; msg.textContent="";
  var code = document.getElementById("fCode").value.trim();
  if(code.length < 6){ msg.className="msg err"; msg.textContent="That code looks too short."; return; }
  var r = await SB.rpc("find_member", { code: code });
  if(r.error){ msg.className="msg err"; msg.textContent = r.error.message; return; }
  if(!(r.data||[]).length){ msg.className="msg err"; msg.textContent="No member with that code."; document.getElementById("memberPanel").classList.add("hidden"); return; }
  current = r.data[0];
  render();
}

function render(){
  var avail = Number(current.stamps) - Number(current.redeemed);
  var onCard = avail % PER; if(avail >= PER) onCard = PER;
  var wrap = document.getElementById("dStamps"); wrap.innerHTML = "";
  for(var i=0;i<PER;i++){
    var el=document.createElement("i");
    if(i<onCard){ el.className="on"; el.textContent="✦"; el.style.animationDelay=(i*70)+"ms"; }
    wrap.appendChild(el);
  }
  document.getElementById("memberPanel").classList.remove("hidden");
  document.getElementById("mName").textContent = current.name || current.email || "Member";
  document.getElementById("mAvail").textContent = avail;
  document.getElementById("mTotal").textContent = current.stamps;
  var rb = document.getElementById("redeemBtn");
  if(avail >= PER){ rb.classList.remove("hidden"); rb.textContent = "Redeem: " + LABEL + " (uses " + PER + " stamps)"; }
  else rb.classList.add("hidden");
  document.getElementById("actMsg").textContent = "";
}

document.getElementById("stampBtn").onclick = async function(){
  if(!current) return;
  var msg = document.getElementById("actMsg"); msg.className="msg";
  var r = await SB.from("stamps").insert({ member_id: current.id, awarded_by: (await SB.auth.getSession()).data.session.user.id });
  if(r.error){ msg.className="msg err"; msg.textContent = r.error.message; return; }
  current.stamps = Number(current.stamps) + 1;
  render();
  msg.textContent = "Stamp awarded ✦";
};

document.getElementById("redeemBtn").onclick = async function(){
  if(!current) return;
  var msg = document.getElementById("actMsg"); msg.className="msg";
  var r = await SB.from("redemptions").insert({
    member_id: current.id, stamps_used: PER, label: LABEL,
    redeemed_by: (await SB.auth.getSession()).data.session.user.id
  });
  if(r.error){ msg.className="msg err"; msg.textContent = r.error.message; return; }
  current.redeemed = Number(current.redeemed) + PER;
  render();
  msg.textContent = "Redeemed. Enjoy ✦";
};

boot();
</script>
</body></html>
